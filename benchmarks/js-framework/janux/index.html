<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>janux (keyed) — js-framework-benchmark</title>
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.4.1/css/bootstrap.min.css"
		/>
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.4.1/css/bootstrap-theme.min.css"
		/>
		<script type="application/janux+state" data-uri="ui://bench#1">
			{ "state": { "rows": [], "selected": 0 }, "sources": {} }

	<body>
		<!-- The island host sits FLUSH inside #main: the newline+tabs a pretty-printed
		     tag would leave behind are two real text nodes in the census the harness
		     takes, which the react/solid/svelte columns (empty root div) do not pay. -->
		<div id="main" class="container"><janux-island key="bench#1" data-jx="bench#1" data-jx-eager></janux-island></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
