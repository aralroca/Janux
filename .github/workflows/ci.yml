name: CI

on:
  push:
    branches: [main]
  # Deliberately unfiltered: every pull request, whatever its base. A
  # `branches: [main]` filter here would stop testing PRs that target anything
  # else, which is strictly less coverage than this.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # The Postgres memory store and the Redis counter store are production
    # adapters whose suites skip themselves when the service is unreachable — so
    # without these they were silently never exercised on CI, and coverage came in
    # ~1.1pp lower than on a machine with the local stack. Credentials match the
    # defaults the suites probe for, so no env override is needed for Postgres.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: assistant
          POSTGRES_PASSWORD: assistant
          POSTGRES_DB: janux_harness_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The default URL carries a password; this service runs without auth.
      JANUX_TEST_REDIS: redis://localhost:6379/15

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # Unit + conformance corpus + docs truth guards, then types.
      - name: Tests
        run: bun run test
      - name: Typecheck
        run: bun run typecheck

      # The browser end-to-end suite drives the built docs app (a real client
      # bundle is what makes islands mount and navigations happen), and skips
      # itself without one — so building is what keeps it from passing silently.
      - name: Build the docs site
        run: bun run --cwd apps/docs build
      # Derived from the suites themselves: any example an e2e file gates on
      # isBuilt()/serveBuilt() gets built here, so a new browser suite can never
      # skip silently because someone forgot to extend a hardcoded list.
      - name: Build the examples the browser e2e drives
        run: |
          apps=$(grep -l -e isBuilt -e serveBuilt e2e/*.e2e.test.ts | xargs grep -hoE "'examples/[a-z0-9-]+'" | tr -d "'" | sort -u)
          # An empty list would let every browser suite skip itself green.
          [ -n "$apps" ] || { echo "::error::no e2e example apps discovered"; exit 1; }
          for app in $apps; do bun run --cwd "$app" build; done
      - name: Install Chrome for Playwright
        run: bunx playwright install --with-deps chrome

      # The examples end to end, against a real server.
      - name: End-to-end
        run: bun run test:e2e

      # Prints the per-area count and fails if total coverage slips below the
      # floor. This is what stops the corpus growing by permutation: rows that add
      # tests without moving coverage no longer look like progress.
      - name: Census and coverage floor
        run: bun run test:census --min-coverage 0.93

  # What npm receives, installed the way a user installs it.
  #
  # Every other job here runs on Bun inside the workspace, where `janux` is a
  # symlink to `packages/janux` and every specifier resolves to TypeScript
  # source. Node refuses to strip types under `node_modules` by design
  # (nodejs/node#57215), so none of that says whether the published packages
  # work at all — this job is the only one that can fail for the reason this
  # pipeline exists.
  package-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile

      # Builds, packs and reads each tarball back: a subpath whose target is
      # missing installs fine and fails on import, and `bun pm pack` goes by
      # `files` alone — .gitignore does not keep anything out of an archive.
      - name: Pack the publishable packages
        run: bun run pack:packages

      # A bare Node project outside the repository: every subpath the manifests
      # advertise is imported (the list is derived from them, never written here),
      # then the same project is type-checked with strict on and strict off. A
      # consumer's tsconfig must not be able to produce errors inside node_modules.
      - name: Install the tarballs in a clean Node project and import them
        run: bun run smoke:node

      - name: Upload the tarballs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tarballs
          path: .packed/
          if-no-files-found: ignore

  # Every example must build, not just boot: the SSR smoke in the e2e suite
  # runs them unbuilt, so a broken client bundle would otherwise ship unnoticed.
  # The list is discovered, never declared — adding a folder adds a job.
  discover-examples:
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.list.outputs.examples }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "examples=$(ls -d examples/*/ | xargs -n1 basename | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  example-build:
    needs: discover-examples
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.discover-examples.outputs.examples) }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build ${{ matrix.example }}
        run: bun run --cwd examples/${{ matrix.example }} build

  # Aggregator so branch protection can require one check: with always() a
  # failed shard reports as failed here, never as skipped.
  examples:
    needs: example-build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All example builds green
        run: test "${{ needs.example-build.result }}" = "success"

  # The docs site is the framework's own dogfood, so its audit scores are a claim
  # about Janux, not about the docs. Separate job: it builds the site and drives
  # headless Chrome, which has nothing to do with the unit suite and would only
  # make that job slower to report.
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # Accessibility, best practices and SEO are asserted at a flat 100 —
      # they measure markup, so less is a defect. Performance is asserted at 99:
      # the score is a function of the machine, and a gate that reddens on its own
      # is one people learn to ignore. Three runs per page, median asserted.
      #
      # Only three pages are audited, one of each kind (home, a docs page, the
      # playground) — not all 76. Green here is not a claim about every page.
      - name: Build the docs site
        run: bun run --cwd apps/docs build

      - name: Lighthouse (docs site)
        run: bun scripts/lighthouse.ts --reports lighthouse-reports

      # A red run is only actionable with the reports.
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          if-no-files-found: ignore
