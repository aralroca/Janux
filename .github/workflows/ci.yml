name: CI

on:
  push:
    branches: [main]
  # Deliberately unfiltered: every pull request, whatever its base. A
  # `branches: [main]` filter here would stop testing PRs that target anything
  # else, which is strictly less coverage than this.
  pull_request:

# The shape of this file is guarded by scripts/ci.test.ts: the Bun floor below
# must be the one `engines` declares, the OS and browser matrices must stay
# whole, every job must feed the `ci` aggregate, and nothing may branch on
# runner.os — a Windows failure is a bug to fix in the code, not to skip.
jobs:
  # The unit + conformance suite, everywhere users are: three OSes, and both
  # ends of the Bun range — the `engines` floor (an unverified floor rots) and
  # latest. No Postgres/Redis here: containers only run on Linux runners, so
  # the adapter suites skip themselves in these lanes and are exercised — with
  # the services up — in the census job below, which owns the coverage claim.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        bun: ['1.3.0', latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      # `@janux/node` declares Node 24+, and its suite spawns a real `node` to
      # assert behaviour Bun's `node:http` shim does not share (it never emits
      # 'close' on a ServerResponse). Pinned rather than inherited: the runner's
      # default version is not a promise, and 24 is the version the adapter
      # claims to support.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Tests
        run: bun run test

  # Types are OS-independent, so one lane is the claim.
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck

  # The full suite once more, with the Postgres memory store and the Redis
  # counter store up: production adapters whose suites skip themselves when the
  # service is unreachable — without these they were silently never exercised on
  # CI, and coverage came in ~1.1pp lower than on a machine with the local
  # stack. Credentials match the defaults the suites probe for. Prints the
  # per-area count and fails if total coverage slips below the floor — which is
  # what stops the corpus growing by permutation: rows that add tests without
  # moving coverage no longer look like progress.
  census:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: assistant
          POSTGRES_PASSWORD: assistant
          POSTGRES_DB: janux_harness_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The default URL carries a password; this service runs without auth.
      JANUX_TEST_REDIS: redis://localhost:6379/15

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Census and coverage floor
        run: bun run test:census --min-coverage 0.93

  # The browser end-to-end suite, once per engine users actually run: the
  # Chrome channel, Firefox and WebKit. Each lane builds what its suites gate
  # on (a real client bundle is what makes islands mount and navigations
  # happen), because a suite that finds no build skips itself green.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest

    # durable-agent drives the Postgres memory store and the Redis rate
    # counter through a real browser session.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: assistant
          POSTGRES_PASSWORD: assistant
          POSTGRES_DB: janux_harness_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      JANUX_TEST_REDIS: redis://localhost:6379/15
      JANUX_E2E_BROWSER: ${{ matrix.browser }}

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile

      - name: Build the docs site
        run: bun run --cwd apps/docs build
      # Derived from the suites themselves: any example an e2e file gates on
      # isBuilt()/serveBuilt() gets built here, so a new browser suite can never
      # skip silently because someone forgot to extend a hardcoded list.
      - name: Build the examples the browser e2e drives
        run: |
          apps=$(grep -l -e isBuilt -e serveBuilt e2e/*.e2e.test.ts | xargs grep -hoE "'examples/[a-z0-9-]+'" | tr -d "'" | sort -u)
          # An empty list would let every browser suite skip itself green.
          [ -n "$apps" ] || { echo "::error::no e2e example apps discovered"; exit 1; }
          for app in $apps; do bun run --cwd "$app" build; done
      # Same trick for the Node adapter suite, which gates on hasNodeBuild()
      # rather than isBuilt(): without its `build:node` output it would skip
      # itself green, and the one suite that proves a Bun-free deployment works
      # is the one that must never do that.
      - name: Build the Node deployments the adapter e2e drives
        run: |
          apps=$(grep -l -e hasNodeBuild -e serveNode e2e/*.e2e.test.ts | xargs grep -hoE "'examples/[a-z0-9-]+'" | tr -d "'" | sort -u)
          [ -n "$apps" ] || { echo "::error::no node-adapter example apps discovered"; exit 1; }
          for app in $apps; do bun run --cwd "$app" build:node; done

      # The chromium lane drives the branded Chrome channel — what the suite
      # has always run on, and what `launchTarget` answers when unset.
      - name: Install ${{ matrix.browser }} for Playwright
        run: bunx playwright install --with-deps ${{ matrix.browser == 'chromium' && 'chrome' || matrix.browser }}

      - name: End-to-end (${{ matrix.browser }})
        run: bun run test:e2e

  # What npm receives, installed the way a user installs it.
  #
  # Every other job here runs on Bun inside the workspace, where `janux` is a
  # symlink to `packages/janux` and every specifier resolves to TypeScript
  # source. Node refuses to strip types under `node_modules` by design
  # (nodejs/node#57215), so none of that says whether the published packages
  # work at all — this job is the only one that can fail for the reason this
  # pipeline exists.
  package-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile

      # Builds, packs and reads each tarball back: a subpath whose target is
      # missing installs fine and fails on import, and `bun pm pack` goes by
      # `files` alone — .gitignore does not keep anything out of an archive.
      - name: Pack the publishable packages
        run: bun run pack:packages

      # A bare Node project outside the repository: every subpath the manifests
      # advertise is imported (the list is derived from them, never written here),
      # then the same project is type-checked with strict on and strict off. A
      # consumer's tsconfig must not be able to produce errors inside node_modules.
      - name: Install the tarballs in a clean Node project and import them
        run: bun run smoke:node

      - name: Upload the tarballs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tarballs
          path: .packed/
          if-no-files-found: ignore

  # Every example must build, not just boot: the SSR smoke in the e2e suite
  # runs them unbuilt, so a broken client bundle would otherwise ship unnoticed.
  # The list is discovered, never declared — adding a folder adds a job.
  discover-examples:
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.list.outputs.examples }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "examples=$(ls -d examples/*/ | xargs -n1 basename | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  example-build:
    needs: discover-examples
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.discover-examples.outputs.examples) }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build ${{ matrix.example }}
        run: bun run --cwd examples/${{ matrix.example }} build

  # Aggregator so the example shards report as one check: with always() a
  # failed shard reports as failed here, never as skipped.
  examples:
    needs: example-build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All example builds green
        run: test "${{ needs.example-build.result }}" = "success"

  # The docs site is the framework's own dogfood, so its audit scores are a claim
  # about Janux, not about the docs. Separate job: it builds the site and drives
  # headless Chrome, which has nothing to do with the unit suite and would only
  # make that job slower to report.
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # Accessibility, best practices and SEO are asserted at a flat 100 —
      # they measure markup, so less is a defect. Performance is asserted at 99:
      # the score is a function of the machine, and a gate that reddens on its own
      # is one people learn to ignore. Three runs per page, median asserted.
      #
      # Only three pages are audited, one of each kind (home, a docs page, the
      # playground) — not all 76. Green here is not a claim about every page.
      - name: Build the docs site
        run: bun run --cwd apps/docs build

      - name: Lighthouse (docs site)
        run: bun scripts/lighthouse.ts --reports lighthouse-reports

      # A red run is only actionable with the reports.
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          if-no-files-found: ignore

  # Static analysis over the JS/TS the repository ships. The repository is
  # private without code scanning, so uploading SARIF is not available: the
  # findings gate the job right here instead, and the SARIF is kept as an
  # artifact. When the repo goes public (or gets code scanning), drop the two
  # trailing steps and the `upload: never`/`output:` pair for the default flow.
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `analyze` reads the workflow run even when it uploads nothing.
      actions: read

    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: codeql-results
      # Gated at error level, which is where CodeQL puts a finding it is
      # confident is a defect. Everything it found here is a warning — mostly
      # regex sanitization in tests, benchmarks and the markdown projection —
      # so those are printed and kept in the SARIF to be worked through, and
      # this step is what stops an error-level one from ever landing quietly.
      - name: Fail on error-level findings
        run: |
          jq -r '.runs[].results[]? | "\(.level // "warning")\t\(.ruleId)\t\(.locations[0].physicalLocation.artifactLocation.uri // "?")"' codeql-results/*.sarif | sort | uniq -c | sort -rn
          jq -es '[.[].runs[].results[]? | select(.level == "error")] | length == 0' codeql-results/*.sarif
      - name: Upload the SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-results
          path: codeql-results/
          if-no-files-found: ignore

  # Known-vulnerability scan over the one lockfile every workspace install
  # resolves from. `fail-on-vuln` (the default) is the gate; the SARIF upload is
  # off because code scanning is unavailable on this private repository.
  osv-scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      scan-args: -L ./bun.lock
      upload-sarif: false

  # Aggregator over everything, so branch protection can require this one
  # check. A job added above must be added to `needs` here — scripts/ci.test.ts
  # fails otherwise. With always() a failed or skipped dependency reports as
  # failed here, never as skipped.
  ci:
    needs: [test, typecheck, census, e2e, package-smoke, discover-examples, example-build, examples, lighthouse, codeql, osv-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job green
        run: echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success")'
